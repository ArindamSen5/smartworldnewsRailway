<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inshorts Style News – Clean UI</title>

<style>
/* -----------------------------------
   THEME VARIABLES
----------------------------------- */
:root {
  --bg: #f5f5f7;
  --text: #000;
  --card-bg: #ffffff;
  --text-light: #555;
  --shadow: 0 2px 10px rgba(0,0,0,0.10);
  --header-bg: #ffffff;
  --primary: #0077ff;
}

.dark-mode {
  --bg: #121212;
  --text: #ffffff;
  --card-bg: #1f1f1f;
  --text-light: #c7c7c7;
  --shadow: 0 2px 12px rgba(255,255,255,0.06);
  --header-bg: #1a1a1a;
}

/* -----------------------------------
   BASE STYLES
----------------------------------- */
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Roboto, sans-serif;
  transition: 0.3s ease;
}

.container {
  width: 92%;
  margin: auto;
  padding-bottom: 60px;
}

/* -----------------------------------
   HEADER
----------------------------------- */
header {
  background: var(--header-bg);
  padding: 18px 0;
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: var(--shadow);
}

header h1 {
  margin: 0 0 10px 0;
  font-size: 1.6rem;
}

/* -----------------------------------
   DARK MODE TOGGLE
----------------------------------- */
.toggle-mode {
  background: var(--primary);
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  float: right;
  cursor: pointer;
  margin-top: -45px;
}

/* -----------------------------------
   TOPICS SCROLL
----------------------------------- */
.topics {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding-top: 10px;
}

.topic-pill {
  padding: 8px 18px;
  background: var(--card-bg);
  border-radius: 25px;
  font-size: 0.9rem;
  white-space: nowrap;
  box-shadow: var(--shadow);
  cursor: pointer;
}

/* -----------------------------------
   SEARCH BAR
----------------------------------- */
.search-box input {
  width: 100%;
  padding: 12px 16px;
  background: var(--card-bg);
  border: none;
  border-radius: 12px;
  box-shadow: var(--shadow);
  margin-top: 14px;
  color: var(--text);
  outline: none;
  font-size: 1rem;
}

/* -----------------------------------
   CAROUSEL
----------------------------------- */
.carousel {
  margin-top: 20px;
  overflow: hidden;
  border-radius: 16px;
  box-shadow: var(--shadow);
}

.carousel img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

/* -----------------------------------
   NEWS GRID
----------------------------------- */
.news-grid {
  margin-top: 25px;
  display: grid;
  gap: 20px;
}

@media (min-width: 768px) {
  .news-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.news-card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: 0.2s ease;
  cursor: pointer;
  min-height: 360px;
}

.news-card:hover {
  transform: scale(1.02);
}

.news-image {
  width: 100%;
  height: 180px;
  border-radius: 12px;
  object-fit: cover;
}

.news-title {
  margin-top: 12px;
  font-size: 1.1rem;
  font-weight: bold;
}

.news-desc {
  margin-top: 10px;
  font-size: 0.9rem;
  color: var(--text-light);
  min-height: 48px;
}

/* SHARE BUTTON */
.share-btn {
  margin-top: 16px;
  padding: 10px;
  text-align: center;
  background: var(--primary);
  color: white;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
}

/* -----------------------------------
   AMAZON PRODUCTS
----------------------------------- */
.product-grid {
  margin-top: 35px;
  display: grid;
  gap: 18px;
}

.product-card {
  background: var(--card-bg);
  padding: 18px;
  border-radius: 14px;
  text-align: center;
  box-shadow: var(--shadow);
}

.product-card img {
  width: 100%;
  height: 200px;
  object-fit: contain;
}

/* -----------------------------------
   FOOTER
----------------------------------- */
footer {
  margin-top: 35px;
  background: var(--header-bg);
  padding: 20px;
  text-align: center;
  color: var(--text-light);
  border-top: 1px solid rgba(0,0,0,0.08);
}
</style>
</head>

<body>

<header>
  <div class="container">
    <h1>Inshorts News</h1>
    <div class="toggle-mode" onclick="toggleMode()">🌙 Dark Mode</div>

    <div class="topics">
      <div class="topic-pill">Latest</div>
      <div class="topic-pill">Trending</div>
      <div class="topic-pill">Tech</div>
      <div class="topic-pill">Sports</div>
      <div class="topic-pill">World</div>
      <div class="topic-pill">India</div>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search news...">
    </div>
  </div>
</header>

<div class="container">

<!-- CAROUSEL -->
<div class="carousel">
  <img src="https://source.unsplash.com/featured/?news" alt="Trending">
</div>

<!-- NEWS GRID -->
<div class="news-grid" id="newsArea"></div>

<!-- AMAZON PRODUCTS -->
<h2 style="margin-top:30px;">Recommended Deals</h2>

<div class="product-grid">
  <div class="product-card">
    <img src="https://m.media-amazon.com/images/I/61Q4QeJM1tL._AC_.jpg">
    <p style="margin:10px 0;">Top Rated Smartwatch</p>
    <button onclick="window.open('YOUR_AMAZON_AFFILIATE_LINK')" 
      style="padding:10px 16px;border:none;background:var(--primary);color:#fff;border-radius:8px;">
      Buy Now
    </button>
  </div>
</div>

</div>

<footer>© 2025 Your News Website. All Rights Reserved.</footer>


<script>
/* -----------------------------
   NEWS DATA
------------------------------ */
const newsList = [
  {
    title: "New Tech Announced in 2025",
    desc: "A breakthrough innovation has just been revealed in the tech world.",
    img: "https://source.unsplash.com/featured/?technology",
    url: "https://google.com"
  },
  {
    title: "Massive Sports Event Completed",
    desc: "Historic performance by top athletes makes global headlines.",
    img: "https://source.unsplash.com/featured/?sports",
    url: "https://google.com"
  }
];

/* -----------------------------
   LOAD NEWS INTO CARDS
------------------------------ */
function loadNews() {
  const box = document.getElementById("newsArea");

  newsList.forEach(n => {
    let card = document.createElement("div");
    card.className = "news-card";
    card.onclick = () => window.open(n.url, "_blank");

    card.innerHTML = `
      <img class="news-image" src="${n.img}">
      <div class="news-title">${n.title}</div>
      <div class="news-desc">${n.desc}</div>
      <div class="share-btn" onclick="event.stopPropagation(); shareNews('${n.title}', '${n.url}')">
          Share
      </div>
    `;

    box.appendChild(card);
  });
}

loadNews();

/* -----------------------------
   SHARE BUTTON
------------------------------ */
function shareNews(title, url) {
  if (navigator.share) {
    navigator.share({ title, url });
  } else {
    window.open(`https://wa.me/?text=${title} - ${url}`);
  }
}

/* -----------------------------
   DARK MODE TOGGLE
------------------------------ */
function toggleMode() {
  document.body.classList.toggle("dark-mode");
}
</script>

</body>
</html>
