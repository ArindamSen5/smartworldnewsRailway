<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartWorld – Latest Tech News</title>

<style>
body {
  font-family: 'Inter', Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding-top: 160px;
}

/* Header */
header {
  background: #0c66d9;
  color: white;
  padding: 1rem;
  font-size: 1.8rem;
  text-align: center;
  font-weight: 700;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

/* Topics */
.topics {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding: 0.8rem;
  background: white;
  box-shadow: 0 1px 6px rgba(0,0,0,0.1);
  position: sticky;
  top: 70px;
  z-index: 999;
}
.topics span {
  padding: 6px 12px;
  background: #e2e8f0;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 0.9rem;
}
.topics span:hover {
  background: #0c66d9;
  color: white;
}

/* Search Section */
.search-section {
  background: white;
  padding: 1rem;
  text-align: center;
  box-shadow: 0 1px 6px rgba(0,0,0,0.15);
  position: sticky;
  top: 120px;
  z-index: 998;
  display: flex;
  justify-content: center;
  gap: 10px;
}
.search-section input {
  flex: 1;
  min-width: 150px;
  padding: 0.7rem;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
}
.search-section button {
  background: #0c66d9;
  color: white;
  padding: 0.7rem 1rem;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* Trending Section */
.trending-section {
  max-width: 1200px;
  margin: 2rem auto;
}
.trending-section h2 {
  margin-bottom: 1rem;
  color: #0c66d9;
}
.trending-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
}

/* News Grid */
.grid {
  max-width: 1200px;
  margin: 1.5rem auto;
  padding: 0 1rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px,1fr));
  gap: 1rem;
}

/* Cards */
.card {
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  transition: 0.2s ease;
  padding: 1rem;
  min-height: 150px;
}
.card:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 6px 14px rgba(0,0,0,0.2);
}
.card-title a {
  text-decoration: none;
  color: #0f172a;
  font-weight: 700;
  font-size: 1.1rem;
  display: block;
  margin-bottom: 0.5rem;
}
.summary {
  color: #475569;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 0.5rem;
}
.source {
  color: #64748b;
  font-size: 0.85rem;
}

/* Footer */
footer {
  text-align: center;
  padding: 1rem;
  background: #e2e8f0;
  color: #475569;
  margin-top: 2rem;
}

/* Load More Button */
.load-more-btn {
  display: block;
  margin: 1rem auto 2rem auto;
  padding: 0.7rem 1.2rem;
  background: #0c66d9;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
}

@media(max-width:768px){
  .grid, .trending-grid { grid-template-columns: 1fr; }
  .search-section input { width: 70%; }
}
</style>
</head>
<body>

<header>SmartWorld – Latest Technology News</header>

<div class="topics">
  <span onclick="loadNews('technology')">Technology</span>
  <span onclick="loadNews('ai')">AI</span>
  <span onclick="loadNews('mobile')">Mobile</span>
  <span onclick="loadNews('gadgets')">Gadgets</span>
  <span onclick="loadNews('startups')">Startups</span>
  <span onclick="loadNews('space')">Space</span>
  <span onclick="loadNews('security')">Cybersecurity</span>
</div>

<div class="search-section">
  <input id="searchInput" placeholder="Search AI, gadgets, mobile…" />
  <button onclick="searchNews()">Search</button>
</div>

<!-- Trending Section -->
<div class="trending-section">
  <h2>Trending</h2>
  <div id="trending-container" class="trending-grid"></div>
</div>

<!-- News Grid -->
<div id="news-container" class="grid"></div>
<button id="loadMoreBtn" class="load-more-btn">Load More News</button>

<footer>
  © 2025 SmartWorld | Clean & Professional Tech News
</footer>

<script>
let currentTopic = 'technology';
let currentPage = 1;
const pageSize = 6;
let displayedUrls = new Set(); // track displayed news

// Load News
async function loadNews(topic = 'technology', append = false){
  if(!append){
    currentPage = 1;
    document.getElementById('news-container').innerHTML = '';
  }
  const container = document.getElementById("news-container");
  try{
    const res = await fetch(`/api/news?topic=${encodeURIComponent(topic)}&page=${currentPage}&size=${pageSize}`);
    const data = await res.json();

    // filter out duplicates
    const newArticles = data.articles.filter(a => !displayedUrls.has(a.url));
    if(newArticles.length === 0 && !append){
      container.innerHTML = '<p style="text-align:center;">No news found.</p>';
      document.getElementById("loadMoreBtn").style.display="none";
      return;
    }

    newArticles.forEach(a => {
      displayedUrls.add(a.url);
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-title"><a href="${a.url}" target="_blank">${a.title}</a></div>
        <div class="summary">${a.summary || ''}</div>
        <div class="source">${a.source || ''} • ${a.published || ''}</div>
      `;
      container.appendChild(card);
    });

    currentPage++;
    document.getElementById("loadMoreBtn").style.display = (newArticles.length < pageSize) ? 'none' : 'block';
  } catch(err){
    console.error(err);
    if(!append) container.innerHTML="<p style='text-align:center'>Failed to load news.</p>";
  }
}

// Search
function searchNews(){
  const q = document.getElementById("searchInput").value.trim();
  currentTopic = q || 'technology';
  currentTopic = encodeURIComponent(currentTopic);
  displayedUrls.clear(); // clear to avoid conflict
  loadTrending(); // reload trending
  loadNews(currentTopic, false);
}

// Load More
document.getElementById("loadMoreBtn").addEventListener('click', ()=>{
  loadNews(currentTopic, true);
});

// --- Trending Section ---
async function loadTrending(){
  const trendingContainer = document.getElementById("trending-container");
  trendingContainer.innerHTML = '';
  try{
    const res = await fetch(`/api/news?topic=technology&page=1&size=10`);
    const data = await res.json();
    const trendingArticles = data.articles.filter(a => !displayedUrls.has(a.url)).slice(0,5);

    trendingArticles.forEach(a => {
      displayedUrls.add(a.url);
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-title"><a href="${a.url}" target="_blank">${a.title}</a></div>
        <div class="summary">${a.summary || ''}</div>
        <div class="source">${a.source || ''} • ${a.published || ''}</div>
      `;
      trendingContainer.appendChild(card);
    });
  } catch(err){
    console.error(err);
    trendingContainer.innerHTML = '<p style="text-align:center;">Trending news not available.</p>';
  }
}

// Initial load
loadTrending();
loadNews(currentTopic);
</script>

</body>
</html>
