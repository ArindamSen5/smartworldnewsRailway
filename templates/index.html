<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini News – Inshorts Style</title>

<style>
    body {
        margin: 0;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
    }

    header {
        background: #ff3c41;
        padding: 15px;
        text-align: center;
        color: white;
        font-size: 22px;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .container {
        max-width: 650px;
        margin: auto;
        padding: 15px;
    }

    .card {
        background: #fff;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 16px;
        box-shadow: 0px 3px 10px rgba(0,0,0,0.10);
        cursor: pointer;
        transition: 0.2s;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
    }

    .news-img {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 10px;
    }

    .title {
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #333;
    }

    .content {
        font-size: 15px;
        color: #555;
        line-height: 1.5;
    }

    .load-more {
        width: 100%;
        background: #ff3c41;
        padding: 12px;
        border-radius: 10px;
        color: #fff;
        font-size: 17px;
        border: none;
        margin: 20px 0;
        cursor: pointer;
    }

    .load-more:hover {
        background: #d63236;
    }

    /* Ad Card */
    .ad-box {
        margin: 20px 0;
        background: #fff;
        padding: 10px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0px 2px 8px rgba(0,0,0,0.08);
    }
</style>
</head>

<body>

<header>MiniNews • Short Updates</header>

<div class="container" id="news-container"></div>

<button class="load-more" onclick="loadMore()">Load More</button>

<script>
let page = 1;

// Clickable card without <a href>
function openNews(url) {
    window.open(url, "_blank");
}

async function loadNews() {
    try {
        // Replace with your news API
        const api = `https://your-api.com/news?page=${page}`;
        const res = await fetch(api);
        const data = await res.json();

        const box = document.getElementById("news-container");

        data.forEach((n, index) => {

            // News Card
            const card = document.createElement("div");
            card.className = "card";
            card.onclick = () => openNews(n.url);

            card.innerHTML = `
                <img class="news-img" src="${n.image || 'https://via.placeholder.com/600x350'}">
                <div class="title">${n.title}</div>
                <div class="content">${n.description}</div>
            `;

            box.appendChild(card);

            // Insert Ad after every 4 news cards
            if ((index + 1) % 4 === 0) {
                const adDiv = document.createElement("div");
                adDiv.className = "ad-box";
                adDiv.innerHTML = `
                    <!-- GOOGLE ADSENSE -->
                    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=YOUR_ADSENSE_CODE_HERE" crossorigin="anonymous"></script>
                    <ins class="adsbygoogle"
                        style="display:block"
                        data-ad-client="YOUR_ADSENSE_CODE_HERE"
                        data-ad-slot="1234567890"
                        data-ad-format="auto"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                `;
                box.appendChild(adDiv);
            }
        });

    } catch (error) {
        console.log("Error loading:", error);
    }
}

function loadMore() {
    page++;
    loadNews();
}

// Auto-load first page
loadNews();
</script>

</body>
</html>
