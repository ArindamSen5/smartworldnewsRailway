<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>News Portal</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    header {
        background: #ffffff;
        padding: 15px 20px;
        font-size: 22px;
        font-weight: bold;
        border-bottom: 1px solid #ddd;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .container {
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }

    /* News Card */
    .news-card {
        background: #fff;
        padding: 16px;
        border-radius: 10px;
        margin-bottom: 18px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        cursor: pointer;
        transition: 0.2s;
    }

    .news-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #222;
    }

    .description {
        font-size: 14px;
        color: #555;
        line-height: 1.5;
    }

    /* Load More Button */
    .load-more {
        display: block;
        width: 100%;
        background: #0078ff;
        color: #fff;
        padding: 12px;
        text-align: center;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        margin: 20px 0;
        border: none;
    }

    .load-more:hover {
        background: #005fcc;
    }
</style>
</head>

<body>

<header>Daily News</header>

<div class="container" id="news-container">
    <!-- News will load here -->
</div>

<button class="load-more" onclick="loadMore()">Load More</button>

<script>
let page = 1;

function openNews(url) {
    window.open(url, "_blank");
}

async function loadNews() {
    try {
        // Replace with your API URL
        const api = `https://your-api-url.com/news?page=${page}`;

        const res = await fetch(api);
        const data = await res.json();

        const container = document.getElementById("news-container");

        data.forEach(item => {
            const card = document.createElement("div");
            card.className = "news-card";
            card.onclick = () => openNews(item.url); // CLICKABLE WITHOUT <a>

            card.innerHTML = `
                <div class="title">${item.title}</div>
                <div class="description">${item.description}</div>
            `;

            container.appendChild(card);
        });

    } catch (e) {
        console.error("Error loading news:", e);
    }
}

function loadMore() {
    page++;
    loadNews();
}

// Load first page
loadNews();
</script>

</body>
</html>
