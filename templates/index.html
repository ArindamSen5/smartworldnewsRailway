<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inshort News – Clean UI</title>

<style>
/* ---------- THEME VARIABLES ---------- */
:root {
  --bg: #f5f5f7;
  --text: #000;
  --card-bg: #fff;
  --text-light: #555;
  --shadow: 0 3px 12px rgba(0,0,0,0.12);
  --header-bg: #ffffff;
}

.dark-mode {
  --bg: #121212;
  --text: #fff;
  --card-bg: #1f1f1f;
  --text-light: #bdbdbd;
  --shadow: 0 3px 12px rgba(255,255,255,0.06);
  --header-bg: #1a1a1a;
}

/* ---------- GLOBAL ---------- */
body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: Arial, sans-serif;
    color: var(--text);
    transition: 0.3s ease;
}

header {
    background: var(--header-bg);
    padding: 16px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 10;
}

.container {
    width: 92%;
    margin: auto;
}

/* ---------- TOPICS BAR ---------- */
.topics {
    display: flex;
    overflow-x: auto;
    gap: 12px;
    padding: 10px 0;
}

.topic-btn {
    padding: 8px 16px;
    border-radius: 20px;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    white-space: nowrap;
    cursor: pointer;
    font-size: 0.9rem;
}

/* ---------- SEARCH ---------- */
.search-bar {
    display: flex;
    margin-top: 14px;
}

.search-bar input {
    flex-grow: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    box-shadow: var(--shadow);
    background: var(--card-bg);
    color: var(--text);
}

/* ---------- CAROUSEL ---------- */
.carousel {
    margin-top: 18px;
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    box-shadow: var(--shadow);
}

.carousel img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

/* ---------- NEWS GRID ---------- */
.news-grid {
    margin-top: 25px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
}

@media (min-width: 768px) {
    .news-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

.news-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 360px;
    transition: 0.2s ease;
    cursor: pointer;
}

.news-card:hover {
    transform: scale(1.02);
}

.news-image {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}

.news-title {
    margin-top: 12px;
    font-size: 1.1rem;
    font-weight: bold;
    flex-grow: 1;
}

.news-desc {
    font-size: 0.9rem;
    color: var(--text-light);
    margin-top: 8px;
    min-height: 48px;
}

/* ---------- SHARE ---------- */
.share-btn {
    margin-top: 14px;
    padding: 10px;
    background: #0077ff;
    color: #fff;
    border-radius: 10px;
    text-align: center;
    font-size: 0.9rem;
    cursor: pointer;
}

/* ---------- AMAZON PRODUCT GRID ---------- */
.product-grid {
    margin-top: 30px;
    display: grid;
    gap: 18px;
}

.product-card {
    background: var(--card-bg);
    padding: 16px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    text-align: center;
}

.product-card img {
    width: 100%;
    max-height: 200px;
    object-fit: contain;
}

/* ---------- FOOTER ---------- */
footer {
    margin-top: 30px;
    padding: 18px;
    background: var(--header-bg);
    text-align: center;
    color: var(--text-light);
}
</style>

</head>
<body>

<!-- ---------- HEADER ---------- -->
<header>
  <div class="container">
    <h2>Inshort News</h2>

    <div class="topics">
        <div class="topic-btn">Latest</div>
        <div class="topic-btn">Trending</div>
        <div class="topic-btn">Tech</div>
        <div class="topic-btn">Sports</div>
        <div class="topic-btn">World</div>
        <div class="topic-btn">India</div>
    </div>

    <div class="search-bar">
        <input type="text" placeholder="Search news...">
    </div>
  </div>
</header>

<div class="container">

<!-- ---------- CAROUSEL ---------- -->
<div class="carousel">
    <img src="https://source.unsplash.com/featured/?news" alt="Trending">
</div>

<!-- ---------- NEWS FEED ---------- -->
<div class="news-grid" id="newsArea"></div>

<!-- ---------- AMAZON AFFILIATE ---------- -->
<h2 style="margin-top: 35px;">Recommended Deals</h2>

<div class="product-grid">
    <div class="product-card">
        <img src="https://m.media-amazon.com/images/I/61Q4QeJM1tL._AC_UL320_.jpg">
        <p>Amazon Bestseller Product</p>
        <button onclick="window.open('YOUR_AMAZON_AFFILIATE_LINK')">Buy Now</button>
    </div>
</div>

</div>

<!-- ---------- FOOTER ---------- -->
<footer>
    © 2025 Your News Site. All Rights Reserved.
</footer>

<script>
/* News Loader */
const newsList = [
    {
        title: "Sample News Title 1",
        desc: "This is a short summary of the news article.",
        img: "https://source.unsplash.com/featured/?breaking-news",
        url: "https://google.com"
    },
    {
        title: "Sample News Title 2",
        desc: "Another interesting news article description goes here.",
        img: "https://source.unsplash.com/featured/?politics",
        url: "https://google.com"
    }
];

function loadNews() {
    const box = document.getElementById("newsArea");

    newsList.forEach(n => {
        const card = document.createElement("div");
        card.className = "news-card";
        card.onclick = () => window.open(n.url, "_blank");

        card.innerHTML = `
            <img src="${n.img}" class="news-image">
            <div class="news-title">${n.title}</div>
            <div class="news-desc">${n.desc}</div>
            <div class="share-btn" onclick="event.stopPropagation(); shareNews('${n.title}', '${n.url}')">
                Share
            </div>
        `;

        box.appendChild(card);
    });
}

loadNews();

/* Share Function */
function shareNews(title, url) {
    if (navigator.share) {
        navigator.share({ title, url });
    } else {
        window.open(`https://wa.me/?text=${title} - ${url}`);
    }
}

/* Dark Mode */
function toggleMode() {
    document.body.classList.toggle("dark-mode");
}
</script>

</body>
</html>
