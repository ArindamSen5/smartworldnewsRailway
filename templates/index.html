<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SmartWorld — Short Tech News</title>

<!-- Google Fonts (optional) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<!-- Google AdSense: replace ca-pub with your publisher id -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1511379920245657" crossorigin="anonymous"></script>

<style>
  :root{
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0c66d9;
    --surface: #ffffff;
    --radius: 12px;
    --max-w: 1100px;
  }
  [data-theme="dark"]{
    --bg: #0b1220;
    --card: #0e1724;
    --text: #e6eef8;
    --muted: #9aa8bf;
    --accent: #3da3ff;
    --surface: #071023;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background:linear-gradient(180deg,var(--bg), #e9eef7 160%);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding-top:160px; /* space for header + bars */
    line-height:1.45;
  }

  /* HEADER */
  header.site-header{
    position:fixed; top:0; left:0; right:0;
    height:72px; display:flex; align-items:center; gap:12px;
    padding:12px 18px; z-index:1200;
    background: linear-gradient(90deg,var(--accent), #0a57b8);
    color: #fff;
    box-shadow: 0 6px 18px rgba(2,6,23,0.12);
  }
  .brand{ display:flex; gap:12px; align-items:center; font-weight:700; font-size:1.05rem; }
  .logo{ width:44px; height:44px; border-radius:10px; display:grid; place-items:center; background:#fff; color:var(--accent); font-weight:800; }

  /* Top row: categories + search + dark toggle */
  .top-row{
    position:fixed; top:72px; left:0; right:0; z-index:1190;
    display:flex; align-items:center; gap:12px; padding:10px 14px;
    background: rgba(255,255,255,0.98);
    box-shadow: 0 1px 6px rgba(2,6,23,0.04);
  }
  [data-theme="dark"] .top-row{ background: rgba(6,12,20,0.7); }

  .categories{ display:flex; gap:8px; overflow-x:auto; padding:6px; -webkit-overflow-scrolling:touch; }
  .categories::-webkit-scrollbar{ display:none; }
  .chip{
    padding:8px 12px; border-radius:999px; background:#eef2ff; color:#063b8a; font-weight:700; cursor:pointer; white-space:nowrap;
    border:1px solid rgba(12,102,217,0.06);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  [data-theme="dark"] .chip{ background: rgba(255,255,255,0.04); color:var(--muted); border:1px solid rgba(255,255,255,0.03); }
  .chip:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(12,102,217,0.06); }
  .chip.active{ background:var(--accent); color:#fff; box-shadow:none; }

  .search-wrap{ margin-left:auto; display:flex; gap:10px; align-items:center; }
  .search-input{
    display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; border:1px solid rgba(15,23,36,0.06);
    background: var(--surface); min-width:220px;
  }
  .search-input input{
    border:0; outline:0; background:transparent; width:160px; color:var(--text);
  }
  .btn{ background:var(--accent); color:#fff; border:0; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:700; }
  .toggle-btn{ background:transparent; border:1px solid rgba(255,255,255,0.12); color:#fff; padding:6px 8px; border-radius:8px; cursor:pointer; }

  /* Main layout */
  main.container{ max-width:var(--max-w); margin:18px auto; padding:0 16px 56px; }

  /* Trending carousel */
  .trending{ margin:10px 0 18px; border-radius:12px; overflow:hidden; background:var(--card); box-shadow:0 6px 18px rgba(2,6,23,0.04); padding:10px; }
  .track{ display:flex; transition:transform .55s cubic-bezier(.2,.9,.3,1); }
  .t-item{ min-width:100%; padding:10px 6px; box-sizing:border-box; font-weight:700; color:var(--accent); }
  .t-item .title{ font-weight:800; }

  /* Grid (Inshort-like cards but 2-col on desktop) */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap:18px;
    align-items:start;
  }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 10px 30px rgba(2,6,23,0.04);
    transition:transform .18s ease, box-shadow .18s ease;
    display:flex;
    flex-direction:column;
    cursor:pointer;
  }
  .card:hover{ transform:translateY(-8px); box-shadow:0 30px 70px rgba(2,6,23,0.06); }

  .thumbnail{ width:100%; height:180px; object-fit:cover; display:block; background:#eef3ff; }
  .card-body{ padding:14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card-title{ font-size:1.05rem; font-weight:800; color:var(--text); line-height:1.25; }
  .card-summary{ color:var(--muted); font-size:0.95rem; flex:1; }
  .card-meta{ display:flex; align-items:center; gap:10px; font-size:0.82rem; color:var(--muted); }

  .tag{ padding:6px 10px; border-radius:999px; background:#eef2ff; color:var(--accent); font-weight:700; font-size:0.8rem; }

  .card-actions{ display:flex; gap:8px; align-items:center; margin-top:8px; }

  /* Ads row */
  .ad-row{ grid-column:1/-1; padding:12px 0; display:flex; justify-content:center; }

  /* Affiliate deals */
  .deals{ margin-top:18px; display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .deal{ background:var(--card); border-radius:12px; padding:10px; text-align:center; box-shadow:0 8px 18px rgba(2,6,23,0.03); cursor:pointer; }

  /* Footer */
  footer{ margin-top:28px; padding:18px; text-align:center; color:var(--muted); }

  /* Responsive */
  @media (max-width:840px){
    body{ padding-top:140px; }
    .thumbnail{ height:160px; }
  }
  @media (max-width:520px){
    .top-row{ padding:8px; top:60px; }
    body{ padding-top:120px; }
    .thumbnail{ height:140px; }
    .search-input input{ width:100px; }
  }
</style>
</head>
<body>

<header class="site-header" role="banner" aria-label="SmartWorld header">
  <div class="brand">
    <div class="logo" aria-hidden="true">SW</div>
    <div>SmartWorld</div>
  </div>

  <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
    <div style="font-weight:700;">Latest Tech</div>
    <button id="themeToggle" class="toggle-btn" title="Toggle theme">🌙</button>
  </div>
</header>

<!-- top row: categories + search -->
<div class="top-row" role="navigation" aria-label="categories and search">
  <div class="categories" id="categories" aria-hidden="false">
    <div class="chip active" data-topic="technology">Technology</div>
    <div class="chip" data-topic="ai">AI</div>
    <div class="chip" data-topic="mobile">Mobile</div>
    <div class="chip" data-topic="gadgets">Gadgets</div>
    <div class="chip" data-topic="startups">Startups</div>
    <div class="chip" data-topic="space">Space</div>
    <div class="chip" data-topic="security">Cybersecurity</div>
  </div>

  <div class="search-wrap" role="search">
    <div class="search-input">
      <input id="searchInput" type="search" placeholder="Search AI, gadgets, mobile…" aria-label="Search news" />
      <button id="searchBtn" class="btn">Search</button>
    </div>
  </div>
</div>

<main class="container" id="main" role="main">
  <!-- Trending -->
  <section class="trending" aria-label="Trending news">
    <div class="track" id="carousel-track">
      <div class="t-item">Loading trending…</div>
    </div>
  </section>

  <!-- News grid -->
  <section id="news-container" class="grid" aria-live="polite">
    <div style="grid-column:1/-1;text-align:center;padding:28px;color:var(--muted);">Loading latest news...</div>
  </section>

  <!-- Affiliate deals -->
  <h3 style="margin-top:26px;text-align:center">🔥 Top Tech Deals</h3>
  <div class="deals" id="deals">
    <!-- Deal cards will be filled by JS (clickable without <a>) -->
  </div>

  <footer>
    © 2025 SmartWorld — Built with Flask + AI — Monetized with AdSense & Affiliate
  </footer>
</main>

<script>
/* =========================
   Configuration
   ========================= */
const CONFIG = {
  NEWS_API: '/api/news', // expects ?topic=...&page=...
  PAGE_SIZE: 10,
  ADS_FREQUENCY: 6, // insert ad row after every N cards
  ADS_CLIENT: 'ca-pub-1511379920245657', // replace if needed
  ADS_SLOT: '2322607708', // replace if needed
  DEALS: [ // affiliate tiles - replace links with your affiliate links
    { title:'Smartphones Deals', img:'https://m.media-amazon.com/images/I/71geVdy6-OS._SL1500_.jpg', url:'https://www.amazon.in/l/1388921031?tag=online0c2b4-21' },
    { title:'Smartwatches', img:'https://m.media-amazon.com/images/I/61aJc8oFvcL._SL1500_.jpg', url:'https://www.amazon.in/s?k=smartwatch&tag=online0c2b4-21' },
    { title:'Headphones', img:'https://m.media-amazon.com/images/I/61kZjy3D3NL._SL1500_.jpg', url:'https://www.amazon.in/s?k=headphone&tag=online0c2b4-21' }
  ]
};

/* =========================
   Theme (light/dark) toggle
   ========================= */
const themeToggle = document.getElementById('themeToggle');
function applyTheme(theme){
  if(theme === 'dark'){
    document.documentElement.setAttribute('data-theme','dark');
    themeToggle.textContent = '☀️';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌙';
  }
  try{ localStorage.setItem('sw_theme', theme); }catch(e){}
}
const savedTheme = (() => { try{ return localStorage.getItem('sw_theme'); }catch(e){return null;} })();
applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
themeToggle.addEventListener('click', ()=>{
  const now = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(now === 'dark' ? 'dark' : 'light');
});

/* =========================
   Helpers
   ========================= */
const escapeHtml = s => s ? String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;') : '';
const safeUrl = s => { try{ return encodeURI(s || '#'); }catch(e){ return '#'; } };

/* =========================
   Build Deals (affiliate tiles) - no <a> tags
   ========================= */
function renderDeals(){
  const el = document.getElementById('deals');
  el.innerHTML = '';
  CONFIG.DEALS.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'deal';
    card.onclick = () => { if(d.url) window.open(d.url, '_blank'); };
    card.innerHTML = `<img src="${escapeHtml(d.img)}" alt="${escapeHtml(d.title)}" style="width:100%;height:140px;object-fit:cover;border-radius:8px" />
                      <div style="font-weight:800;margin-top:8px">${escapeHtml(d.title)}</div>`;
    el.appendChild(card);
  });
}
renderDeals();

/* =========================
   News loading / rendering
   ========================= */
let page = 1;
let currentTopic = 'technology';
let loading = false;

const newsContainer = document.getElementById('news-container');

async function fetchNews(topic=currentTopic, p=1){
  // Build URL
  const url = `${CONFIG.NEWS_API}?topic=${encodeURIComponent(topic)}&page=${p}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Network error');
  return await res.json();
}

function createCard(article){
  const card = document.createElement('article');
  card.className = 'card';
  card.onclick = () => { if(article.url) window.open(article.url, '_blank'); };

  // Thumbnail if exists
  const thumbSrc = article.image || article.thumbnail || '';
  const thumbHtml = thumbSrc ? `<img class="thumbnail" loading="lazy" src="${escapeHtml(thumbSrc)}" alt="${escapeHtml(article.title)}">` : '';

  const title = escapeHtml(article.title || 'Untitled');
  const summary = escapeHtml(article.summary || article.description || '');

  card.innerHTML = `
    ${thumbHtml}
    <div class="card-body">
      <div class="card-title">${title}</div>
      <div class="card-summary">${summary}</div>
      <div style="flex:1"></div>
      <div class="card-meta">
        <div class="tag">${escapeHtml(article.source || 'Source')}</div>
        <div style="margin-left:auto">${escapeHtml(article.published || '')}</div>
      </div>
      <div class="card-actions">
        <button class="btn" onclick="event.stopPropagation(); shareArticle('${escapeHtml(article.title)}','${escapeHtml(article.url)}','${escapeHtml(article.summary||'')}')">Share</button>
      </div>
    </div>
  `;
  return card;
}

async function loadNews(topic=currentTopic, append=false){
  if(loading) return;
  loading = true;
  if(!append){
    page = 1;
    newsContainer.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:28px;color:var(--muted);">Loading news…</div>`;
  } else {
    const loader = document.createElement('div');
    loader.className = 'loader';
    loader.style.gridColumn = '1/-1';
    loader.style.textAlign = 'center';
    loader.style.padding = '18px';
    loader.style.color = 'var(--muted)';
    loader.textContent = 'Loading more…';
    newsContainer.appendChild(loader);
  }

  try{
    const data = await fetchNews(topic, page);
    const articles = data.articles || [];

    // clear initial loader
    Array.from(newsContainer.querySelectorAll('.loader')).forEach(n=>n.remove());
    if(!append) newsContainer.innerHTML = '';

    if(articles.length === 0){
      if(!append) newsContainer.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:28px;color:var(--muted);">No stories found.</div>`;
      loading = false;
      return;
    }

    // Append article cards & ads
    articles.forEach((a, idx)=>{
      const card = createCard(a);
      newsContainer.appendChild(card);

      // global index for ad insertion
      const globalIndex = ((page-1) * (data.pageSize || CONFIG.PAGE_SIZE)) + idx + 1;
      if(globalIndex % CONFIG.ADS_FREQUENCY === 0){
        const adRow = document.createElement('div');
        adRow.className = 'ad-row';
        adRow.innerHTML = `
          <ins class="adsbygoogle"
               style="display:block"
               data-ad-client="${CONFIG.ADS_CLIENT}"
               data-ad-slot="${CONFIG.ADS_SLOT}"
               data-ad-format="auto"
               data-full-width-responsive="true"></ins>`;
        newsContainer.appendChild(adRow);
        try{ (adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){}
      }
    });

    // If first page, load trending from first 5 articles
    if(page === 1) loadTrending(articles.slice(0,5));

    // If number of articles less than pageSize -> no more
    if(articles.length < (data.pageSize || CONFIG.PAGE_SIZE)){
      // no more pages
      // but we still allow manual retry or category switch
    }

  }catch(err){
    console.error(err);
    if(!append) newsContainer.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:28px;color:var(--muted);">Failed to load news.</div>`;
  } finally {
    loading = false;
  }
}

/* Search button */
document.getElementById('searchBtn').addEventListener('click', ()=>{
  const q = document.getElementById('searchInput').value.trim();
  if(!q){ loadNews('technology', false); return; }
  currentTopic = q; page = 1; loadNews(currentTopic, false);
});
document.getElementById('searchInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') document.getElementById('searchBtn').click(); });

/* Category chips */
document.getElementById('categories').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentTopic = chip.dataset.topic || chip.textContent.trim().toLowerCase();
  page = 1;
  loadNews(currentTopic, false);
});

/* Load initial page */
loadNews(currentTopic, false);

/* =========================
   Trending carousel
   ========================= */
let carouselInterval = null;
function loadTrending(items){
  const track = document.getElementById('carousel-track');
  track.innerHTML = '';
  if(!items || items.length === 0){
    track.innerHTML = '<div class="t-item">No trending stories</div>';
    return;
  }
  items.forEach(it=>{
    const node = document.createElement('div');
    node.className = 't-item';
    node.textContent = it.title || '';
    node.onclick = () => { if(it.url) window.open(it.url, '_blank'); };
    track.appendChild(node);
  });

  if(carouselInterval){ clearInterval(carouselInterval); carouselInterval = null; }
  if(items.length <= 1) return;
  let idx = 0;
  carouselInterval = setInterval(()=>{
    idx = (idx + 1) % items.length;
    track.style.transform = 'translateX(-' + (idx * 100) + '%)';
  }, 4500);
}

/* =========================
   Share function (native + WhatsApp fallback)
   ========================= */
function shareArticle(title, url, text){
  const shareText = (title ? title + '\n\n' : '') + (text || '') + (url ? '\n\nRead more: ' + url : '');
  if(navigator.share){
    try{
      navigator.share({ title: title, text: text, url: url });
    }catch(e){
      // fallback to WhatsApp
      window.open('https://wa.me/?text=' + encodeURIComponent(shareText), '_blank');
    }
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(shareText), '_blank');
  }
}

/* =========================
   Infinite scroll (IntersectionObserver)
   ========================= */
const sentinel = document.createElement('div');
sentinel.style.cssText = 'height:1px';
document.getElementById('main').appendChild(sentinel);

const io = new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting && !loading){
    page++;
    loadNews(currentTopic, true);
  }
}, { root:null, rootMargin:'500px' });
io.observe(sentinel);

/* =========================
   Polite ad init
   ========================= */
try{
  (adsbygoogle = window.adsbygoogle || []).push({});
}catch(e){
  // ignore
}
</script>

</body>
</html>
