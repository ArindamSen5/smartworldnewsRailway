<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini News – Inshorts Style</title>

<style>
    body {
        margin: 0;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
    }

    header {
        background: #ff3c41;
        padding: 15px;
        text-align: center;
        color: white;
        font-size: 22px;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .container {
        max-width: 650px;
        margin: auto;
        padding: 15px;
    }

    .card {
        background: #fff;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 16px;
        box-shadow: 0px 3px 10px rgba(0,0,0,0.10);
        cursor: pointer;
        transition: 0.2s;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
    }

    .news-img {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 10px;
        object-fit: cover;
    }

    .title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #222;
    }

    .content {
        font-size: 15px;
        color: #555;
        line-height: 1.5;
    }

    .load-more {
        width: 100%;
        background: #ff3c41;
        padding: 12px;
        border-radius: 10px;
        color: #fff;
        font-size: 17px;
        border: none;
        margin: 20px 0;
        cursor: pointer;
    }

    .load-more:hover {
        background: #d63236;
    }
</style>
</head>

<body>

<header>Mini News</header>

<div class="container" id="news-container"></div>

<button class="load-more" onclick="loadMore()">Load More</button>

<script>
let page = 1;

// OPEN NEWS WITHOUT <a>
function openNews(url) {
    window.open(url, "_blank");
}

// DUMMY NEWS DATA (safe, site won’t break)
const sampleNews = [
    {
        title: "India launches new space mission",
        description: "ISRO successfully launched a new satellite to boost communication infrastructure.",
        image: "https://picsum.photos/700/400?random=1",
        url: "https://news.example.com/1"
    },
    {
        title: "Tech company announces new AI device",
        description: "The device promises to change the future of automation and productivity.",
        image: "https://picsum.photos/700/400?random=2",
        url: "https://news.example.com/2"
    },
    {
        title: "Big update in the entertainment industry",
        description: "A major celebrity announced a new project that fans are excited about.",
        image: "https://picsum.photos/700/400?random=3",
        url: "https://news.example.com/3"
    }
];

function loadNews() {
    const container = document.getElementById("news-container");

    // Load 3 sample cards each page
    sampleNews.forEach(news => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openNews(news.url);

        card.innerHTML = `
            <img class="news-img" src="${news.image}" />
            <div class="title">${news.title}</div>
            <div class="content">${news.description}</div>
        `;

        container.appendChild(card);
    });
}

function loadMore() {
    page++;
    loadNews();
}

loadNews(); // Load first set
</script>

</body>
</html>
